upstream minos_api {
    zone minos_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8443 resolve;
}

server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /certs/localhost.crt;
    ssl_certificate_key /certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Docker Desktop can open a published port with an http:// URL.
    error_page 497 =308 https://$http_host$request_uri;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    # OAuth callbacks can contain sensitive query parameters.
    access_log off;

    location ~ ^/(api|accounts|health)(/|$) {
        include /etc/nginx/proxy-api.conf;
    }
    location = /signin-google {
        include /etc/nginx/proxy-api.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
