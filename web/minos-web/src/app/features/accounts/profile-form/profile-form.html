<section class="panel" aria-labelledby="profile-heading">
  <header class="panel-header"><h2 id="profile-heading">Edit display name</h2></header>
  <form class="settings-form" [formGroup]="form" (pointerdown)="feedback.prepareSubmit($event)" (ngSubmit)="submit()" novalidate [attr.aria-busy]="pending()" aria-labelledby="profile-heading">
    @if (error() || (submitted() && fieldError())) {
      <div #summary class="form-errors" role="alert" tabindex="-1" aria-labelledby="profile-errors">
        <h3 id="profile-errors">{{ error() ? 'Name not saved' : 'Check your display name' }}</h3>
        @if (error()) { <p>{{ error() }}</p> }
        @if (fieldError()) { <ul><li><a [href]="fieldLink()" (click)="focusField($event)">{{ fieldError() }}</a></li></ul> }
      </div>
    }
    <div class="form-field">
      <label for="profile-name">Display name</label>
      <input id="profile-name" formControlName="displayName" autocomplete="nickname" required maxlength="80"
        (input)="edit()" (blur)="blur()" [attr.aria-invalid]="!!fieldError()"
        [attr.aria-describedby]="fieldError() ? 'profile-name-hint profile-name-error' : 'profile-name-hint'" />
      <minos-field-feedback fieldId="profile-name" hint="The name shown in Minos." [error]="fieldError()" />
    </div>
    <div class="form-actions"><button class="button" type="submit" [disabled]="pending() || blocked()">{{ pending() ? 'Saving…' : 'Save name' }}</button>
      <button class="button button--secondary" type="button" [disabled]="pending() || blocked()" (click)="cancel()">Cancel</button></div>
  </form>
</section>
