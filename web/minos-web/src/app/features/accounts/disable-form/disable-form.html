<section class="panel danger-panel" aria-labelledby="disable-heading">
  <header class="panel-header"><h2 id="disable-heading">Verify your password</h2></header>
  <form class="settings-form" [formGroup]="form" (pointerdown)="feedback.prepareSubmit($event)" (ngSubmit)="review()" novalidate [attr.aria-busy]="pending()" aria-labelledby="disable-heading">
    @if (error() || (submitted() && fieldError())) {
      <div #summary class="form-errors" role="alert" tabindex="-1" aria-labelledby="disable-errors">
        <h3 id="disable-errors">{{ error() ? 'Disabling not confirmed' : 'Check your current password' }}</h3>
        @if (error()) { <p>{{ error() }}</p> }
        @if (fieldError()) { <ul><li><a [href]="fieldLink()" (click)="focusField($event)">{{ fieldError() }}</a></li></ul> }
      </div>
    }
    <minos-password-field fieldId="disable-password" label="Current password" [control]="form.controls.password" [error]="fieldError()" (edited)="feedback.edit('password')" (left)="blur()" />
    <div class="form-actions"><button class="button button--danger" type="submit" [disabled]="pending() || blocked() || confirming()">Review account disabling</button>
      <button class="button button--secondary" type="button" [disabled]="pending() || blocked() || confirming()" (click)="close()">Cancel</button></div>
  </form>
</section>
@if (confirming()) {
  <minos-confirmation-dialog heading="Disable your account?" actionLabel="Disable account" busyLabel="Disabling…" [busy]="pending()"
    description="You will be signed out on all devices and this account will no longer be able to sign in. This cannot be undone from your account settings."
    (cancelled)="cancel()" (confirmed)="confirm()" />
}
