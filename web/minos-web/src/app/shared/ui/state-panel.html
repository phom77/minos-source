<div class="state" [attr.data-kind]="kind()">
  <div class="state-message" [attr.role]="kind() === 'error' ? 'alert' : 'status'" aria-atomic="true">
    @if (kind() === 'loading') {
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    } @else {
      <span class="state-icon"><minos-icon [name]="kind() === 'error' ? 'warning' : 'library'" /></span>
    }
    <h3>{{ heading() }}</h3>
    <p>{{ description() }}</p>
  </div>
  <div class="state-actions"><ng-content /></div>
</div>
