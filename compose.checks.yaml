# Optional verification image; no additional production projects or hosts.
services:
  checks-postgres:
    image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    profiles: [checks]
    environment:
      POSTGRES_DB: minos
      POSTGRES_USER: minos_bootstrap
      POSTGRES_PASSWORD: ${MINOS_BOOTSTRAP_PASSWORD:?Missing bootstrap password}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      MINOS_MIGRATOR_PASSWORD: ${MINOS_MIGRATOR_PASSWORD:?Missing migrator password}
      MINOS_API_PASSWORD: ${MINOS_API_PASSWORD:?Missing API password}
      MINOS_WORKER_PASSWORD: ${MINOS_WORKER_PASSWORD:?Missing worker password}
    volumes:
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-minos-roles.sh:ro
      - ./scripts/postgres-bootstrap.sql:/minos/postgres-bootstrap.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U minos_bootstrap -d minos && test "$$(cat /proc/1/comm)" = postgres']
      interval: 3s
      timeout: 3s
      retries: 30

  checks-migrate:
    image: ${MINOS_PROJECT_NAME:-minos}-api:local
    profiles: [checks]
    command: [--migrate]
    environment:
      ConnectionStrings__Minos: Host=checks-postgres;Database=minos;Username=minos_migrator;Password=${MINOS_MIGRATOR_PASSWORD:?Missing migrator password}
    depends_on:
      checks-postgres:
        condition: service_healthy

  checks-grants:
    image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    profiles: [checks]
    entrypoint: [/bin/sh, /minos/apply-grants.sh]
    environment:
      MINOS_MIGRATOR_PASSWORD: ${MINOS_MIGRATOR_PASSWORD:?Missing migrator password}
      MINOS_DATABASE_HOST: checks-postgres
    volumes:
      - ./docker/apply-grants.sh:/minos/apply-grants.sh:ro
      - ./scripts/postgres-runtime-grants.sql:/minos/postgres-runtime-grants.sql:ro
    depends_on:
      checks-migrate:
        condition: service_completed_successfully

  checks:
    image: ${MINOS_PROJECT_NAME:-minos}-checks:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: checks
    profiles: [checks]
    environment:
      MINOS_TEST_SANDBOX: '1'
      MINOS_TEST_WORKSPACE_VOLUME: ${MINOS_PROJECT_NAME:-minos}-judge-workspaces
      MINOS_TEST_REPOSITORY: /src
      Authentication__Google__Enabled: 'false'
      Minos__Artifacts__Root: /private-checks
      ConnectionStrings__Minos: Host=checks-postgres;Database=minos;Username=minos_api;Password=${MINOS_API_PASSWORD:?Missing API password}
      MINOS_TEST_MIGRATION_CONNECTION: Host=checks-postgres;Database=minos;Username=minos_migrator;Password=${MINOS_MIGRATOR_PASSWORD:?Missing migrator password}
      MINOS_TEST_WORKER_CONNECTION: Host=checks-postgres;Database=minos;Username=minos_worker;Password=${MINOS_WORKER_PASSWORD:?Missing worker password}
      MINOS_TEST_BOOTSTRAP_CONNECTION: Host=checks-postgres;Database=minos;Username=minos_bootstrap;Password=${MINOS_BOOTSTRAP_PASSWORD:?Missing bootstrap password}
    group_add:
      - '${MINOS_DOCKER_GID:-0}'
    volumes:
      - judge-workspaces:/tmp/minos-judge-execution
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /private-checks:mode=700,uid=1654,gid=1654
    depends_on:
      init:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
      checks-grants:
        condition: service_completed_successfully
